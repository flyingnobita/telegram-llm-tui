[dependencies]
textwrap = "0.16"
ratatui = "0.26"
crossterm = "0.27"
telegram_llm_core = { path = "../core" }
time = { version = "0.3", features = ["formatting", "local-offset"] }

[dev-dependencies]
insta = "1.39"
tokio = { version = "1", features = ["macros", "rt"] }
