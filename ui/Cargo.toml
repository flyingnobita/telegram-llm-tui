[package]
name = "ui"
version = "0.1.0"
edition = "2021"

[dependencies]
textwrap = "0.16"
ratatui = "0.26"
crossterm = "0.27"
telegram_llm_core = { path = "../core" }
time = { version = "0.3", features = ["formatting", "local-offset"] }
arboard = "3.3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
insta = "1.39"
