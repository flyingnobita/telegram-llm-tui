[package]
name = "llm"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
thiserror = "1"
async-openai = "0.27"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13.1", features = ["json"] }
serde_json = "1.0.149"
tracing = "0.1.44"
regex = "1"

