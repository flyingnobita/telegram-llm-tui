# App defaults

[auth]
# Default auth method when not overridden.
default_method = "phone"
# Supported values: "phone", "qr"
# - phone: login code + optional 2fa password
# - qr: QR login token flow

[telegram]
# Update pump buffer size (number of events).
update_buffer = 1024
# Send pipeline queue capacity.
send_queue_limit = 256
# Max retry attempts for send pipeline. Set to 0 for unlimited retries.
send_retry_max_attempts = 0
# Base retry delay in milliseconds for non-rate-limit errors.
send_retry_base_delay_ms = 500
# Max retry delay in milliseconds for non-rate-limit errors.
send_retry_max_delay_ms = 30000
# Max number of recent messages to fetch per chat on startup.
history_per_chat = 100

[telegram.cache]
# Cache database path. Relative paths resolve from repo root.
db_path = "data/cache.sqlite"
# Max number of chats to keep in cache. Set to 0 for unlimited.
max_chats = 0
# Max number of cached messages per chat.
max_messages_per_chat = 5000
# Max total cache size in bytes. Set to 0 for unlimited.
max_bytes = 0
# Flush debounce in milliseconds.
flush_debounce_ms = 500

[logging]
# Primary app log file path. Relative paths resolve from repo root.
log_file = "logs/app.log"
# Error log file path. Relative paths resolve from repo root.
error_log_file = "logs/app-error.log"
# Log level for stdout. Supported: "error", "warn", "info", "debug", "trace".
level = "info"
# Log format. Supported: "plain".
format = "plain"
# Log rotation strategy. Supported: "size", "daily".
rotation = "size"
# Max size per log file in megabytes.
rotation_max_size_mb = 1
# Number of rotated files to keep.
rotation_max_files = 20
# Log Telegram and LLM content verbatim by default.
log_content = true

[ui]
# Supported values: "vim", "vscode"
keymap = "vscode"
# Chat list width in columns. Set to 0 to use the default.
chat_list_width = 32
# Maximum number of log lines to show in the log window.
log_window_max_lines = 500

[llm]
# Enable LLM integration.
enabled = true
# Supported providers: "lm_studio", "openai", "mock".
provider = "lm_studio"

[llm.lm_studio]
# Base URL for the provider.
base_url = "http://192.168.1.103:1234/v1"
# Model identifier.
model = "deepseek-coder-v2-lite-instruct"
